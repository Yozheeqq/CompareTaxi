version: "2.3"

services:
    taxi_compare-container:
        image: ghcr.io/userver-framework/ubuntu-22.04-userver-pg:latest
        privileged: true
        network_mode: bridge
        environment:
          - PREFIX=${PREFIX:-~/.local}
          - CCACHE_DIR=/taxi_compare/.ccache
          - CORES_DIR=/cores
        volumes:
          - .:/taxi_compare:rw
        ports:
          - 8080:8080
        working_dir: /taxi_compare
        entrypoint:
          - ./tests/run_as_user.sh
