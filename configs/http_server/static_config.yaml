components_manager:
    task_processors:                  # Task processor is an executor for coroutine tasks

        main-task-processor:          # Make a task processor for CPU-bound coroutine tasks.
            worker_threads: $worker-threads         # Process tasks in 4 threads.

        fs-task-processor:            # Make a separate task processor for filesystem bound tasks.
            worker_threads: $worker-fs-threads

        producer-task-processor:  # Task processor for handling message delivery reports
            thread_name: producer
            worker_threads: $worker-threads     # Threads are shared between all producers in program

    default_task_processor: main-task-processor

    components:                       # Configuring components that were registered via component_list

        kafka-producer:                   # Kafka producer component name must start with kafka-producer
            delivery_timeout: 10s         # Timeout for message delivery
            queue_buffering_max: 100ms    # Time, producer waits before sending a message
            enable_idempotence: true      # Whether to enable idempotence mode
            security_protocol: PLAINTEXT  # Broker connection settings

        default-secdist-provider:                        # Component that loads configuration of hosts and passwords
            config: /etc/kafka/secure_data/secure_data.json  # Values are supposed to be stored in this file
            missing-ok: true                             # ... but if the file is missing it is still ok
            # environment-secrets-key: SECDIST_CONFIG      # ... values will be loaded from this environment value

        server:
            listener:                 # configuring the main listening socket...
                port: $server-port            # ...to listen on this port and...
                task_processor: main-task-processor    # ...process incoming requests on this task processor.
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard  # Drop logs if the system is too busy to write them down.

        # Dynamic config options. Cache is disabled, updates are disabled.
        dynamic-config:
            # For most of userver dynamic configs, defaults are used, some are overridden here.
            # See userver "dynamic config" docs for what configs exist.
            defaults:
                HTTP_CLIENT_CONNECTION_POOL_SIZE: 1000
                POSTGRES_DEFAULT_COMMAND_CONTROL:
                    network_timeout_ms: 750
                    statement_timeout_ms: 500

        handler-server-monitor:  # Официальный компонент для метрик
            task_processor: main-task-processor
            path: "/metrics"      # Эндпоинт будет доступен по этому пути
            method: GET
            monitor-handler: false
            format: prometheus

        http-client:
            pool-statistics-disable: false
            thread-name-prefix: http-client
            threads: 2
            fs-task-processor: fs-task-processor

        testsuite-support: {}
        user-info-database:
            dbconnection#env: PG_CONNECTION
            blocking_task_processor: fs-task-processor
            dns_resolver: async

        http-client:
            load-enabled: $is_testing
            fs-task-processor: fs-task-processor

        dns-client:
            fs-task-processor: fs-task-processor

        tests-control:
            load-enabled: $is_testing
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor
        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            throttling_enabled: false
            url_trailing_slash: strict-match

        handler-get-price-predict:
            path: /get-price-predict
            method: GET
            task_processor: main-task-processor

        handler-get-user-info:
            path: /get-user-info
            method: GET
            task_processor: main-task-processor

        handler-get-config:
            path: /get-config
            method: GET
            task_processor: main-task-processor

        handler-set-price-info:
            path: /set-price-info
            method: POST
            task_processor: main-task-processor

        handler-set-user-info:
            path: /set-user-info
            method: POST
            task_processor: main-task-processor
